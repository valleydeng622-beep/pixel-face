<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开场 · 角色创建</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FBF1DE'/%3E%3Crect x='7' y='2' width='2' height='9' fill='%23A9701A'/%3E%3Crect x='4' y='10' width='8' height='2' fill='%23A9701A'/%3E%3Crect x='6' y='12' width='4' height='2' fill='%238A5C16'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=DotGothic16&display=swap">
<style>
:root{
  --ink:#0A0814;
  --win:#FFFCF3;
  --win-lo:#EFE2C8;
  --win-hi:#FFFFFF;
  --line:#C9A468;
  --line-d:#8F6A34;
  --gold:#A9701A;
  --gold-d:#8A5C16;
  --cream:#3B2B28;
  --dim:#5E5460;
  --dim2:#8C8088;
  --rose:#C4556C;
  --teal:#2F8A72;
  --px:"DotGothic16",ui-monospace,"SF Mono",Menlo,monospace;
  --s:4;               /* 舞台整数倍缩放，JS 会覆盖 */
  --sw:80;
  --sh:96;
  --rs:3;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:#FBF1DE;
  color:var(--cream);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:12.5px;
  letter-spacing:.02em;
  -webkit-font-smoothing:none;
  padding:16px 12px 26px;
  display:flex;justify-content:center;align-items:flex-start;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 20% 30%, rgba(169,112,26,.16) 0 1px, transparent 1px),
    radial-gradient(1px 1px at 71% 20%, rgba(169,112,26,.12) 0 1px, transparent 1px),
    radial-gradient(1px 1px at 88% 58%, rgba(169,112,26,.10) 0 1px, transparent 1px),
    radial-gradient(120% 90% at 50% -12%, #FFFDF6 0%, #FBF0DA 46%, #F1E2C6 100%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
  background:repeating-linear-gradient(0deg, rgba(120,88,44,.07) 0 1px, rgba(120,88,44,0) 1px 3px);
}

/* ============ 外框 ============ */
.app{width:min(1120px,100%);position:relative;z-index:1}

.hdr{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  padding:0 2px 9px;border-bottom:1px solid rgba(160,120,66,.45);
  position:relative;
}
.hdr::after{
  content:"";position:absolute;left:0;bottom:-3px;width:100%;height:5px;
  background-image:repeating-linear-gradient(90deg, rgba(160,120,66,.30) 0 2px, transparent 2px 8px);
  pointer-events:none;
}
.titlewrap{display:flex;align-items:center;gap:12px;min-width:0}
.emblem{width:26px;height:26px;flex:none;display:block}
h1{
  margin:0;font-size:16.5px;font-weight:600;letter-spacing:.14em;color:var(--cream);
  text-shadow:0 2px 0 #E3D1AC, 0 0 12px rgba(169,112,26,.10);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
h1 span{color:var(--gold)}
.sub{
  margin:3px 0 0;font-family:var(--px);font-size:9.5px;letter-spacing:.26em;
  color:var(--dim2);text-transform:uppercase;
}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none}

.tbtn{
  font-family:var(--px);font-size:10px;letter-spacing:.12em;
  color:var(--dim);background:#FFFCF3;border:0;padding:6px 9px;cursor:pointer;
  box-shadow:inset 0 0 0 1px #D3BE95, 0 0 0 2px #6E4E28;
  transition:color .12s, background .12s;
  min-height:30px;
}
.tbtn:hover{color:#3B2B28;background:#FFF4DC}
.tbtn[aria-pressed="false"]{color:#9C9096}
.tbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ============ 布局 ============ */
.cols{
  display:grid;
  grid-template-columns:minmax(260px,1fr) minmax(0,1.35fr);
  gap:12px;margin-top:14px;align-items:start;
}
@media (max-width:820px){
  .cols{grid-template-columns:1fr}
}

/* ============ 窗口 ============ */
.win{
  position:relative;
  background:linear-gradient(180deg,#FFFDF6 0%, #FBF2E0 34%, #F2E6CC 100%);
  padding:11px;
  box-shadow:
    inset 0 0 0 1px rgba(160,120,66,.80),
    inset 0 0 0 3px rgba(255,253,246,.96),
    inset 0 0 0 4px rgba(201,164,104,.55),
    inset 0 1px 0 rgba(255,255,255,.95),
    0 0 0 2px #6E4E28,
    0 5px 0 rgba(110,78,40,.30);
}
.win::after{
  content:"";position:absolute;inset:4px;pointer-events:none;
  background-image:radial-gradient(rgba(150,110,60,.10) 1px, transparent 1px);
  background-size:3px 3px;
  opacity:.55;
  z-index:0;
}
.win > *{position:relative;z-index:1}

/* ============ 房间 ============ */
.room[hidden]{display:none}
.room{
  position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:18px;overflow-y:auto;
  background:#FBF1DE;
}
.room-head{display:flex;gap:12px;align-items:baseline;font-family:var(--px);letter-spacing:.14em}
.room-name{font-size:14px;color:var(--gold-d)}
.room-doing{font-size:12px;color:var(--dim)}
.room-env{font-size:10px;color:var(--dim2);letter-spacing:.1em}
.room-stage{position:relative;line-height:0;background:#F4E8D3;
  box-shadow:0 0 0 3px #6E4E28, 0 0 0 7px #E7D3AE, 0 0 0 8px #CDB489;}
#roomCv{
  width:calc(288px * var(--rs));height:calc(180px * var(--rs));
  image-rendering:pixelated;image-rendering:crisp-edges;display:block;
}
.cam-hud{
  position:absolute;left:9px;top:7px;display:flex;align-items:center;gap:6px;
  font-family:var(--px);font-size:9px;letter-spacing:.14em;color:#EAF2EC;
  text-shadow:0 1px 0 rgba(0,0,0,.45);pointer-events:none;
}
.cam-hud .rec{width:5px;height:5px;background:#E2564E;box-shadow:0 0 0 1px rgba(255,255,255,.45);animation:recblink 1.8s steps(2) infinite}
@keyframes recblink{50%{opacity:.2}}
.cam-scan{position:absolute;inset:0;pointer-events:none;opacity:.42;
  background:repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 1px, rgba(0,0,0,0) 1px 3px);}
.room-acts{display:flex;gap:10px}
.dress{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:18px;background:#FBF1DE;overflow-y:auto}
.dress[hidden]{display:none}
.dress-main{display:flex;gap:18px;align-items:flex-start;justify-content:center;width:100%;max-width:860px}
.dress-prev{border:3px solid #6E4E28;background:#F4E8D3;box-shadow:0 0 0 6px #E7D3AE;padding:10px;line-height:0;flex:0 0 auto}
#dressCv{width:192px;height:512px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
@media (max-height:720px){#dressCv{width:144px;height:384px}}
.dress-side{display:flex;gap:14px;align-items:flex-start;min-width:0}
.deco{display:flex;flex-direction:column;gap:7px;width:100%;max-width:620px}
.deco[hidden]{display:none}
.deco-btn{position:absolute;left:-58px;top:50%;transform:translateY(-50%);z-index:3;
  width:46px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border:3px solid #6E4E28;background:#FFFAEE;box-shadow:0 2px 0 #CDB489;padding:0}
.deco-btn.inside{left:0;top:-58px;transform:none}
.deco-btn[aria-pressed="true"]{background:#3B2B28;border-color:#3B2B28}
.deco-btn svg{width:22px;height:22px;display:block;color:#3B2B28}
.deco-btn[aria-pressed="true"] svg{color:#FFFAEE}
@media (max-width:760px){.deco-btn{width:40px;height:40px;left:-46px}.deco-btn.inside{left:0;top:-52px}}
.deco-tabs,.deco-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dtab{font:inherit;font-size:11px;letter-spacing:.06em;padding:4px 9px;cursor:pointer;
  border:2px solid #6E4E28;background:#FFFAEE;color:#3B2B28}
.dtab[aria-pressed="true"]{background:#3B2B28;color:#FFFAEE}
.dchip{font:inherit;font-size:11px;display:flex;align-items:center;gap:5px;padding:3px 8px;cursor:pointer;
  border:2px solid #6E4E28;background:#FFFAEE;color:#3B2B28}
.dchip[aria-pressed="true"]{border-color:#A9701A;background:#F8E6C2;box-shadow:inset 0 0 0 1px #A9701A}
.dsw{display:inline-flex;line-height:0}
.dsw i{display:block;width:7px;height:11px}

/* ============ 分页 ============ */
.tabs{display:flex;gap:6px}
.tab{
  flex:1;font-family:var(--px);font-size:10px;letter-spacing:.16em;
  color:#8A7A70;background:#F1E3C8;border:0;padding:9px 6px;cursor:pointer;
  box-shadow:inset 0 0 0 1px #D8C6A0, 0 0 0 2px #6E4E28;
  min-height:38px;transition:color .12s,background .12s;
}
.tab:hover{background:#FFF6E2;color:#6B5A4E}
.tab[aria-selected="true"]{
  color:#8A5C16;background:#FFF3D2;
  box-shadow:inset 0 0 0 1px #A9701A, inset 0 -3px 0 #C79A45, 0 0 0 2px #6E4E28;
}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ============ 舞台 ============ */
.stage-win{padding:12px 12px 10px}
.stagewrap{position:relative;display:flex;justify-content:center;background:#F7EBD5;}
#stage{
  display:block;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  width:calc(var(--sw) * 1px * var(--s));
  height:calc(var(--sh) * 1px * var(--s));
  box-shadow:0 0 0 2px #6E4E28, inset 0 0 0 1px rgba(150,110,60,.18);
}
.plate{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);
  display:flex;align-items:center;gap:6px;
  background:rgba(255,252,242,.94);
  box-shadow:inset 0 0 0 1px rgba(169,112,26,.55), 0 0 0 2px rgba(110,78,40,.85);
  padding:3px 9px;white-space:nowrap;max-width:88%;
}
.plate i{width:4px;height:4px;background:var(--gold);display:block;flex:none}
#plateName{
  font-size:12px;letter-spacing:.1em;color:var(--cream);
  overflow:hidden;text-overflow:ellipsis;max-width:150px;
}
.lv{
  position:absolute;right:10px;bottom:10px;
  font-family:var(--px);font-size:9.5px;letter-spacing:.14em;color:var(--dim);
  background:rgba(255,252,242,.92);padding:2px 6px;
  box-shadow:inset 0 0 0 1px rgba(160,120,66,.32);
}
.foot{
  margin-top:9px;padding-top:8px;border-top:1px dashed rgba(160,120,66,.28);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:11.5px;color:var(--dim);line-height:1.7;
}
.foot .k{color:var(--gold-d);font-family:var(--px);font-size:9.5px;letter-spacing:.1em}

/* ============ 菜单 ============ */
.menu{display:flex;flex-direction:column;gap:10px;min-width:0}

.list-win{padding:9px 8px}
.wl{
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--px);font-size:9px;letter-spacing:.2em;color:var(--dim2);
  padding:0 4px 6px;border-bottom:1px solid rgba(160,120,66,.18);margin-bottom:5px;
}
.wl .r{color:var(--gold-d)}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.cat{
  display:flex;align-items:baseline;gap:7px;padding:4px 6px;cursor:pointer;
  color:var(--cream);border:0;background:transparent;width:100%;text-align:left;
  font-family:inherit;font-size:12px;letter-spacing:.02em;
  transition:background .1s;
  min-height:26px;
}
.cat:hover{background:rgba(169,112,26,.10)}
.cat .idx{font-family:var(--px);font-size:10px;color:var(--dim2);width:14px;flex:none}
.cat .nm{flex:none}
.cat .ldr{flex:1;height:1px;align-self:center;min-width:8px;
  background-image:repeating-linear-gradient(90deg, rgba(160,120,66,.32) 0 1px, transparent 1px 4px)}
.cat .vl{flex:none;color:var(--teal);font-size:11.5px}
.cat[aria-selected="true"]{
  background:linear-gradient(90deg, rgba(169,112,26,.15), rgba(169,112,26,.04));
  box-shadow:inset 2px 0 0 var(--gold);
}
.cat[aria-selected="true"] .nm{color:#8A5C16}
.cat[aria-selected="true"] .vl{color:#A9701A}
.cat[aria-selected="true"] .idx{color:var(--gold)}
.cat:focus-visible{outline:1px solid var(--gold);outline-offset:-1px}

.grid-win{padding:9px 10px 11px}
.ghead{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:0 3px 7px;border-bottom:1px solid rgba(160,120,66,.18);margin-bottom:8px;
}
.ghead .t{font-size:12px;letter-spacing:.1em;color:#4A3A32}
.ghead .t em{font-family:var(--px);font-style:normal;font-size:9px;letter-spacing:.18em;color:var(--dim2);margin-left:6px}
.ghead .c{font-family:var(--px);font-size:10px;letter-spacing:.14em;color:var(--gold)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.cell{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:5px 2px 4px;background:#FFFDF6;border:0;cursor:pointer;
  box-shadow:inset 0 0 0 1px #DCCBA8, 0 0 0 1px #6E4E28;
  transition:background .1s, box-shadow .1s;
  min-height:82px;
}
.cell:hover{background:#FFF5E2}
.cell[aria-selected="true"]{
  background:linear-gradient(180deg,#FFF0CE,#F8E4B8);
  box-shadow:inset 0 0 0 1px var(--gold), inset 0 0 0 3px rgba(169,112,26,.18), 0 0 0 1px #6E4E28;
}
.cell:focus-visible{outline:1px solid var(--gold);outline-offset:1px}
.cell canvas{
  display:block;width:64px;height:64px;image-rendering:pixelated;
  background:transparent;
}
.cell .cn{
  font-size:10px;letter-spacing:.04em;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.cell[aria-selected="true"] .cn{color:#8A5C16}

/* 名字条 */
.name-win{padding:8px 10px}
.namewin{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.namewin label{font-size:11.5px;color:var(--dim);letter-spacing:.1em;flex:none}
#nameInput{
  flex:1;min-width:90px;
  font-family:"PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:16px;letter-spacing:.14em;color:var(--gold-d);
  background:#FFFDF6;border:0;padding:4px 8px;
  box-shadow:inset 0 0 0 1px #D3BE95, inset 0 2px 0 rgba(120,88,44,.22);
  min-height:32px;
}
#nameInput:focus{outline:0;box-shadow:inset 0 0 0 1px var(--gold), inset 0 2px 0 rgba(0,0,0,.4)}
.hint{
  font-size:10px;color:var(--dim2);letter-spacing:.06em;
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
.hint b{font-family:var(--px);font-weight:400;color:var(--dim);font-size:9.5px;letter-spacing:.1em}

/* 按钮 */
.actions{display:flex;gap:8px}
.btn{
  flex:1;
  font-family:inherit;font-size:12.5px;letter-spacing:.14em;color:var(--cream);
  background:linear-gradient(180deg,#F6E9CC,#E7D4AE);
  border:0;padding:10px 12px;cursor:pointer;
  box-shadow:inset 0 0 0 1px #C5AE85, inset 0 2px 0 rgba(255,255,255,.65), inset 0 -3px 0 rgba(120,86,20,.22), 0 0 0 2px #6E4E28, 0 4px 0 #6E4E28;
  transition:transform .05s, background .12s;
  min-height:44px;
}
.btn:hover{background:linear-gradient(180deg,#FFF6E0,#EFDCB8)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 1px #C5AE85, inset 0 2px 0 rgba(120,88,44,.35), 0 0 0 2px #6E4E28, 0 1px 0 #6E4E28}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.primary{
  color:#1A1206;
  background:linear-gradient(180deg,#F2D493,#D3A94E);
  box-shadow:inset 0 0 0 1px #FFF0C4, inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(120,86,20,.40), 0 0 0 2px #6E4E28, 0 4px 0 #6E4E28;
}
.btn.primary:hover{background:linear-gradient(180deg,#FBE1A8,#DDB55A)}

/* ============ 弹窗 ============ */
.modal{
  position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(74,52,30,.42);
}
.modal[hidden]{display:none}
.mbox{width:min(420px,100%);animation:pop .16s steps(3) both}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.mbox .win{padding:14px}
.mtitle{
  font-size:14px;letter-spacing:.16em;color:#8A5C16;display:flex;align-items:center;gap:8px;
  padding-bottom:9px;border-bottom:1px solid rgba(169,112,26,.28);margin-bottom:11px;
}
.mtitle i{width:5px;height:5px;background:var(--gold);display:block;flex:none}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px;color:var(--dim)}
.mrow b{color:var(--cream);font-weight:400;text-align:right}
.mname{font-size:15px;color:var(--gold);letter-spacing:.12em}
.mbtns{display:flex;gap:8px;margin-top:13px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:#FFFCF3;color:var(--gold-d);
  font-size:12px;letter-spacing:.1em;padding:8px 16px;
  box-shadow:inset 0 0 0 1px rgba(169,112,26,.6), 0 0 0 2px #6E4E28;
  opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;z-index:14;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">

  <header class="hdr">
    <div class="titlewrap">
      <svg class="emblem" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="7" y="1" width="2" height="14" fill="#A9701A"/>
        <rect x="1" y="7" width="14" height="2" fill="#A9701A"/>
        <rect x="4" y="4" width="2" height="2" fill="#8A5C16"/>
        <rect x="10" y="4" width="2" height="2" fill="#8A5C16"/>
        <rect x="4" y="10" width="2" height="2" fill="#8A5C16"/>
        <rect x="10" y="10" width="2" height="2" fill="#8A5C16"/>
        <rect x="7" y="7" width="2" height="2" fill="#FFFDF6"/>
      </svg>
      <div>
        <h1>开场 · <span>角色创建</span></h1>
        <p class="sub">character create — 16bit</p>
      </div>
    </div>
    <div class="hdr-r">
      <button class="tbtn" id="btnSound" aria-pressed="true" title="音效开关">SOUND ON</button>
    </div>
  </header>

  <main class="cols">

    <section class="stage-win win" aria-label="角色预览">
      <div class="stagewrap">
        <canvas id="stage" width="80" height="96" aria-label="角色立绘"></canvas>
        <div class="plate"><i></i><span id="plateName">未命名</span></div>
        <div class="lv">居家 · 周末午后</div>
      </div>
      <div class="foot">
        <span class="k">当前</span>
        <span id="summary">—</span>
      </div>
    </section>

    <section class="menu">
      <div class="tabs">
        <button class="tab" type="button" data-page="face" aria-selected="true">01 脸</button>
        <button class="tab" type="button" data-page="body" aria-selected="false">02 全身</button>
      </div>

      <div class="list-win win">
        <div class="wl"><span>部位 · PART</span><span class="r" id="partCount">13</span></div>
        <ol class="cats" id="cats"></ol>
      </div>

      <div class="grid-win win">
        <div class="ghead">
          <span class="t" id="gridTitle">发型<em id="gridEn">HAIR</em></span>
          <span class="c" id="gridCount">01 / 08</span>
        </div>
        <div class="opts" id="opts"></div>
      </div>

      <div class="name-win win">
        <div class="namewin">
          <label for="nameInput">名字</label>
          <input id="nameInput" maxlength="8" value="小满" spellcheck="false" autocomplete="off">
        </div>
        <div class="hint" style="margin-top:7px">
          <span><b>↑↓</b> 部位</span><span><b>←→</b> 样式</span>
          <span><b>ENTER</b> 决定</span><span><b>R</b> 随机</span>
        </div>
      </div>

      <div class="actions">

<script>
(function(){
'use strict';

/* 角色缓冲区：48×56 像素，全部按点阵画，放大后仍然是硬边像素 */
var CW=48, CH=56, CX=24, INK='#0A0814';

/* ==================== 调色板 ==================== */
var SKIN={
  pale:{n:'苍白',deep:'#B37C6B',shade:'#D6A792',base:'#F0CEBC',light:'#FFF0E4'},
  fair:{n:'自然',deep:'#A57050',shade:'#CB9E7C',base:'#EDC2A0',light:'#FFE4CA'},
  honey:{n:'蜜色',deep:'#8B5630',shade:'#B98052',base:'#DCA671',light:'#F3C79A'},
  tan:{n:'小麦',deep:'#6B3E1E',shade:'#966034',base:'#BB8455',light:'#DBA97C'},
  nut:{n:'深棕',deep:'#41200F',shade:'#6A3520',base:'#8B4E32',light:'#A96844'},
  fae:{n:'霜蓝',deep:'#6B7F9E',shade:'#8FA5BF',base:'#B7C9DD',light:'#E2EEFA'}
};
var HAIR={
  black:{n:'乌黑',dark:'#16121F',base:'#312B44',hi:'#5C5678'},
  brown:{n:'栗棕',dark:'#2E1C0E',base:'#5A3A1E',hi:'#8E5F34'},
  blond:{n:'亚麻',dark:'#66471A',base:'#A87C2E',hi:'#E6C066'},
  red:{n:'赤红',dark:'#480E18',base:'#7E1F29',hi:'#BE4C44'},
  silver:{n:'银白',dark:'#414A62',base:'#7C88A6',hi:'#C8D3E8'},
  blue:{n:'湖蓝',dark:'#0E2438',base:'#1E4C6C',hi:'#3C8AA4'},
  pink:{n:'樱粉',dark:'#571A32',base:'#93406A',hi:'#CE7AA2'},
  green:{n:'苔绿',dark:'#122418',base:'#2A4E30',hi:'#528856'}
};
var IRIS={
  amber:{n:'琥珀',dark:'#8A4A10',base:'#D08A2A',lit:'#F4C464'},
  green:{n:'翠绿',dark:'#1E4E32',base:'#3E8C58',lit:'#7CD49A'},
  ice:{n:'冰蓝',dark:'#1E4A78',base:'#3A80B8',lit:'#8CD0F0'},
  violet:{n:'紫晶',dark:'#3E1F5E',base:'#6E42A0',lit:'#B08CE0'},
  crimson:{n:'赤红',dark:'#6E1418',base:'#A82E32',lit:'#E8766A'},
  steel:{n:'灰银',dark:'#3A4250',base:'#646E80',lit:'#A6B2C4'},
  gold:{n:'金瞳',dark:'#8A6418',base:'#C8A038',lit:'#F6DC78'},
  brown:{n:'深棕',dark:'#2A1810',base:'#543420',lit:'#8A5C34'}
};
var OUT={base:'#3F5A48',shade:'#2A3E32',hi:'#57775F',cream:'#E2D3AE',leather:'#6B4630',belt:'#2E2018'};
var TEE={base:'#F5F2EA',shade:'#D9D3C3',rib:'#C4BDAB'};
var LIP='#8E4A52', LIP_D='#5C222A', MOUTH_D='#321018';

/* ==================== 脸型 ==================== */
var FACE={
  oval:{top:10,w:[5,8,10,11,12,12,12,12,12,12,12,12,12,12,12,11,11,11,10,10,9,8,6,3]},
  round:{top:10,w:[6,9,11,12,12,12,12,12,12,12,12,12,12,12,12,12,12,11,11,11,10,9,8,5]},
  square:{top:10,w:[6,9,11,12,12,12,12,12,12,12,12,12,12,12,12,12,12,12,12,11,11,10,8,6]},
  sharp:{top:10,w:[5,8,10,12,12,12,12,12,12,11,11,11,11,10,10,10,9,9,8,8,7,6,5,4]}
};
Object.keys(FACE).forEach(function(k){
  var f=FACE[k];
  f.bot=f.top+f.w.length-1;
  f.eyeY=f.top+Math.round((f.bot-f.top)*0.52);
  f.browY=f.eyeY-4; f.noseY=f.eyeY+5; f.mouthY=f.eyeY+8;
});
var EYE_L=15, EYE_R=27;

/* ==================== 基础 ==================== */
function px(g,x,y,w,h,c){ g.fillStyle=c; g.fillRect(x,y,w,h); }
function rowsFill(g,w,top,expand,c){
  g.fillStyle=c;
  if(expand>0){
    g.fillRect(CX-w[0]-expand, top-1, (w[0]+expand)*2, 1);
    g.fillRect(CX-w[w.length-1]-expand, top+w.length, (w[w.length-1]+expand)*2, 1);
  }
  for(var i=0;i<w.length;i++){ g.fillRect(CX-w[i]-expand, top+i, (w[i]+expand)*2, 1); }
}
function hAt(f,y){ var i=y-f.top; if(i<0) return f.w[0]; if(i>=f.w.length) return f.w[f.w.length-1]; return f.w[i]; }


/* ==================== 身体 ==================== */
var BUILDS={
  slim:{tw:11,aw:3},
  normal:{tw:13,aw:4},
  plush:{tw:15,aw:4}
};
var FRAMES={narrow:-1, std:0, broad:1};

/* ==================== 服装：色板 ==================== */
var DYE=[
  {n:'米白',base:'#F2EEE2',shade:'#D6CFBE',hi:'#FDFAF1',deep:'#B4AB9A'},
  {n:'炭灰',base:'#4A4A54',shade:'#33333B',hi:'#63636F',deep:'#26262C'},
  {n:'雾蓝',base:'#7C97B4',shade:'#5F7893',hi:'#A7BED4',deep:'#476074'},
  {n:'藕粉',base:'#D9A8AE',shade:'#BC868E',hi:'#F0C6CB',deep:'#9A6870'},
  {n:'苔绿',base:'#6E8A5A',shade:'#546E43',hi:'#90AB7A',deep:'#405638'},
  {n:'酒红',base:'#8E3B44',shade:'#6E2A33',hi:'#AB5961',deep:'#521F29'},
  {n:'芥黄',base:'#C9A24A',shade:'#A68436',hi:'#E3C171',deep:'#88692B'},
  {n:'牛仔',base:'#4E6E96',shade:'#3A567A',hi:'#6F8DAE',deep:'#2B4360'}
];
function dyeOf(i){ var c=DYE[i|0]; return c&&c.base?c:DYE[0]; }

/* ==================== 服装：单品表 ==================== */
var TOPS={
  tee:{n:'T恤',sleeve:'short'},
  shirt:{n:'衬衫',sleeve:'short',collar:1,placket:1},
  knit:{n:'针织衫',sleeve:'long',rib:1},
  tank:{n:'背心',sleeve:'none'}
};
var COATS={
  cardigan:{n:'开衫',open:1,long:1},
  jacket:{n:'夹克',long:1},
  trench:{n:'风衣',long:1,veryLong:1}
};
var PANTS={
  long:{n:'长裤'},
  short:{n:'短裤'},
  cargo:{n:'工装裤',pocket:1}
};
var SKIRTS={
  a:{n:'A字裙',flare:4},
  pleat:{n:'百褶裙',flare:2,pleat:1},
  pencil:{n:'铅笔裙',short:14}
};
var DRESSES={
  slip:{n:'吊带裙',strap:'thin',flare:5,len:20},
  vest:{n:'背心裙',strap:'wide',flare:3,len:22},
  longdress:{n:'长裙',strap:'wide',flare:6,len:999}
};
var SOCKS={
  short:{n:'短袜',top:'-5'},
  knee:{n:'及膝袜',top:'-16'},
  long:{n:'长袜',top:'-24'}
};
var SHOES={
  sneaker:{n:'运动鞋'},
  boot:{n:'短靴'},
  sandal:{n:'凉鞋'},
  loafer:{n:'皮鞋'}
};

/* ---------- 上身：躯干 + 肩坡 ---------- */
function drawTopG(g,G,col,id){
  var t=TOPS[id]||TOPS.tee;
  var sh=[Math.round(G.out*0.56),Math.round(G.out*0.78),G.out-1,G.out];
  rowsFill(g,sh,G.sy,1,INK);
  rowsFill(g,sh,G.sy,0,col.base);
  for(var i=0;i<4;i++){
    px(g,CX-sh[i]+1,G.sy+i,1,1,col.shade);
    px(g,CX+sh[i]-2,G.sy+i,1,1,col.shade);
  }
  var n=G.hem-(G.sy+4), tr=[], j;
  for(j=0;j<n;j++) tr.push(G.tw);
  rowsFill(g,tr,G.sy+4,1,INK);
  rowsFill(g,tr,G.sy+4,0,col.base);
  for(j=0;j<n;j++){
    px(g,CX-G.tw+1,G.sy+4+j,1,1,col.shade);
    px(g,CX+G.tw-2,G.sy+4+j,1,1,col.shade);
  }
  /* 领口 */
  if(t.collar){
    px(g,CX-4,G.sy,8,1,col.deep);
    px(g,CX-3,G.sy+1,3,1,col.deep); px(g,CX+1,G.sy+1,3,1,col.deep);
    px(g,CX-2,G.sy+2,2,1,col.hi); px(g,CX+1,G.sy+2,2,1,col.hi);
  } else if(t.sleeve==='none'){
    px(g,CX-5,G.sy+1,10,1,col.deep);
    px(g,CX-4,G.sy+2,8,1,col.base);
  } else {
    px(g,CX-4,G.sy,8,1,col.shade);
    px(g,CX-3,G.sy+1,6,1,col.shade);
    px(g,CX-4,G.sy+1,1,1,col.deep); px(g,CX+3,G.sy+1,1,1,col.deep);
  }
  /* 下摆 */
  px(g,CX-G.tw,G.hem,G.tw*2,1,col.shade);
  px(g,CX-G.tw,G.hem+1,G.tw*2,1,col.deep);
  /* 门襟 / 罗纹 / 褶皱 */
  if(t.placket){
    for(j=0;j<n;j+=3) px(g,CX,G.sy+4+j,1,1,col.deep);
    px(g,CX-2,G.sy+7,2,2,col.shade);
  }
  if(t.rib){
    for(var r=CX-G.tw+1;r<CX+G.tw-1;r+=2) px(g,r,G.hem-1,1,1,col.shade);
    px(g,CX-G.tw+3,G.sy+14,1,5,col.shade);
    px(g,CX+G.tw-4,G.sy+16,1,4,col.shade);
  }
  if(t.sleeve!=='none'){
    px(g,CX-G.tw+3,G.sy+12,1,4,col.shade);
    px(g,CX+G.tw-4,G.sy+13,1,3,col.shade);
  }
}

/* ---------- 手臂皮肤 ---------- */
function drawArmsSkin(g,G,skin){
  for(var a=0;a<2;a++){
    var ax=a===0?CX-G.out:CX+G.out-G.aw;
    var outer=a===0?ax:ax+G.aw-1;
    var inner=a===0?ax+G.aw-1:ax;
    var armEnd=G.full?G.shB+2:G.hem-2;
    var bh=armEnd-(G.sy+1);
    px(g,ax,G.sy+1,G.aw,bh,skin.base);
    px(g,outer,G.sy+1,1,bh,skin.shade);
    px(g,inner,G.sy+2,1,bh-1,'#CEC7B5');
    px(g,ax-1,G.sy+1,1,bh+1,INK);
    px(g,ax+G.aw,G.sy+1,1,bh+1,INK);
    px(g,ax+1,G.sy+1,1,3,skin.light);
    /* 手 */
    px(g,ax+1,armEnd,G.aw-2,3,skin.base);
    px(g,ax-1,armEnd,1,3,INK);
    px(g,ax+G.aw,armEnd,1,3,INK);
    px(g,ax+1,armEnd+3,G.aw-2,1,INK);
  }
}

/* ---------- 袖子 ---------- */
function drawSleeves(g,G,col,id){
  var t=TOPS[id]||TOPS.tee;
  if(t.sleeve==='none') return;
  var long=t.sleeve==='long';
  var end=long?G.shB+1:G.sy+9;
  for(var a=0;a<2;a++){
    var ax=a===0?CX-G.out:CX+G.out-G.aw;
    var outer=a===0?ax:ax+G.aw-1;
    px(g,ax,G.sy+1,G.aw,end-G.sy-1,col.base);
    px(g,outer,G.sy+1,1,end-G.sy-1,col.shade);
    px(g,ax,G.sy+1,1,end-G.sy-1,INK);
    px(g,ax+G.aw-1,G.sy+1,1,end-G.sy-1,INK);
    px(g,ax+1,G.sy+1,G.aw-2,1,col.hi);
    if(long){ px(g,ax,end,G.aw,1,col.deep); px(g,ax+1,end+1,G.aw-2,1,col.shade); }
    else { px(g,ax,end-1,G.aw,1,col.shade); px(g,ax+1,end,G.aw-2,1,col.deep); }
  }
}

/* ---------- 裤子 ---------- */
function drawPantsG(g,G,col,id){
  var p=PANTS[id]||PANTS.long;
  var shY=G.shY, footY=G.footY, tw=G.tw, lw=G.lw;
  var end=p.n==='短裤'?G.shB+1:footY+2;
  for(var l=0;l<2;l++){
    var lx=l===0?CX-tw+1:CX+1;
    px(g,lx,shY,lw,end-shY,col.base);
    px(g,lx+(l===0?0:lw-1),shY,1,end-shY,col.shade);
    px(g,lx,shY,1,end-shY,INK);
    px(g,lx+lw-1,shY,1,end-shY,INK);
  }
  /* 裆部 */
  px(g,CX-tw+1,shY,tw*2-2,6,col.base);
  px(g,CX,shY+1,1,5,col.shade);
  /* 腰头 */
  px(g,CX-tw+1,shY,tw*2-2,2,col.deep);
  px(g,CX-tw+1,shY,tw*2-2,1,col.hi);
  px(g,CX-1,shY+2,2,1,col.deep);
  /* 裤脚 */
  if(p.n!=='短裤'){
    px(g,CX-tw+1,footY+1,lw,1,col.deep);
    px(g,CX+1,footY+1,lw,1,col.deep);
  }
  if(p.pocket){
    px(g,CX-tw+3,shY+12,3,4,col.shade); px(g,CX-tw+3,shY+12,3,1,col.deep);
    px(g,CX+tw-6,shY+12,3,4,col.shade); px(g,CX+tw-6,shY+12,3,1,col.deep);
  }
}

/* ---------- 裙子 ---------- */
function drawSkirtG(g,G,col,id){
  var t=SKIRTS[id]||SKIRTS.a;
  var h=t.short||18, w0=G.tw-1, w1=G.tw+1+(t.flare||2);
  for(var y=0;y<h;y++){
    var w=Math.round(w0+(w1-w0)*(y/h));
    px(g,CX-w,G.shY+y,w*2,1,col.base);
    px(g,CX-w,G.shY+y,1,1,col.shade);
    px(g,CX+w-1,G.shY+y,1,1,col.deep);
    px(g,CX-w,G.shY+y,w*2,1,col.base);
  }
  /* 腰头 */
  px(g,CX-w0,G.shY,w0*2,2,col.deep);
  px(g,CX-w0,G.shY,w0*2,1,col.hi);
  /* 褶 */
  if(t.pleat){
    for(var x=-w1+2;x<w1-1;x+=3) px(g,CX+x,G.shY+3,1,h-3,col.shade);
  }
  /* 收边 */
  var wb=Math.round(w1);
  px(g,CX-wb,G.shY+h,wb*2,1,col.deep);
}

/* ---------- 连衣裙 ---------- */
function drawDressG(g,G,col,id){
  var d=DRESSES[id]||DRESSES.slip;
  /* 上身 */
  var sh=[Math.round(G.out*0.56),Math.round(G.out*0.78),G.out-1,G.out];
  rowsFill(g,sh,G.sy,1,INK);
  rowsFill(g,sh,G.sy,0,col.base);
  var bodEnd=G.shY, n=bodEnd-(G.sy+4), tr=[], j;
  for(j=0;j<n;j++) tr.push(G.tw);
  rowsFill(g,tr,G.sy+4,1,INK);
  rowsFill(g,tr,G.sy+4,0,col.base);
  for(j=0;j<n;j++){
    px(g,CX-G.tw+1,G.sy+4+j,1,1,col.shade);
    px(g,CX+G.tw-2,G.sy+4+j,1,1,col.shade);
  }
  /* 领口 / 肩带 */
  if(d.strap==='thin'){
    px(g,CX-5,G.sy,2,4,col.base); px(g,CX+3,G.sy,2,4,col.base);
    px(g,CX-4,G.sy+1,8,1,col.deep);
    px(g,CX-3,G.sy+2,6,1,col.shade);
  } else {
    px(g,CX-5,G.sy,3,3,col.base); px(g,CX+2,G.sy,3,3,col.base);
    px(g,CX-4,G.sy+1,8,1,col.deep);
  }
  /* 裙身 */
  var len=d.len, h=(!G.full)?0:((len>900)?Math.max(0,G.footY-6-G.shY):len);
  var w0=G.tw, w1=G.tw+1+(d.flare||3);
  for(var y=0;y<h;y++){
    var w=Math.round(w0+(w1-w0)*Math.min(1,y/h*1.6));
    px(g,CX-w,G.shY+y,w*2,1,col.base);
    px(g,CX-w,G.shY+y,1,1,col.shade);
    px(g,CX+w-1,G.shY+y,1,1,col.deep);
  }
  px(g,CX-Math.round(w1),G.shY+h,Math.round(w1)*2,1,col.deep);
  /* 腰带 */
  px(g,CX-G.tw,G.shY,G.tw*2,1,col.deep);
}

/* ---------- 外套 ---------- */
function drawCoatG(g,G,col,id){
  var c=COATS[id]||COATS.jacket;
  var end=c.veryLong?G.shY+20:G.hem+4;
  var sh=[Math.round(G.out*0.56),Math.round(G.out*0.78),G.out-1,G.out];
  rowsFill(g,sh,G.sy,1,INK);
  rowsFill(g,sh,G.sy,0,col.base);
  for(var i=0;i<4;i++){
    px(g,CX-sh[i]+1,G.sy+i,1,1,col.shade);
    px(g,CX+sh[i]-2,G.sy+i,1,1,col.shade);
  }
  /* 前襟：开衫敞开，其余闭合 */
  if(c.open){
    px(g,CX-G.tw,G.sy+4,G.tw-2,end-G.sy-4,col.base);
    px(g,CX+2,G.sy+4,G.tw-2,end-G.sy-4,col.base);
    px(g,CX-G.tw,G.sy+4,1,end-G.sy-4,col.shade);
    px(g,CX+G.tw-1,G.sy+4,1,end-G.sy-4,col.shade);
    px(g,CX-G.tw,G.sy+4,G.tw-2,1,col.hi);
  } else {
    px(g,CX-G.tw,G.sy+4,G.tw*2,end-G.sy-4,col.base);
    px(g,CX-G.tw,G.sy+4,1,end-G.sy-4,col.shade);
    px(g,CX+G.tw-1,G.sy+4,1,end-G.sy-4,col.shade);
    px(g,CX,G.sy+4,1,end-G.sy-4,col.deep);
    /* 翻领 */
    px(g,CX-5,G.sy+1,4,4,col.shade); px(g,CX+1,G.sy+1,4,4,col.shade);
    px(g,CX-4,G.sy+2,3,1,col.hi);
  }
  /* 下摆 / 袖 */
  px(g,CX-G.tw,end,c.open?G.tw-2:G.tw*2,1,col.deep);
  if(c.open) px(g,CX+2,end,G.tw-2,1,col.deep);
  for(var a=0;a<2;a++){
    var ax=a===0?CX-G.out:CX+G.out-G.aw;
    var outer=a===0?ax:ax+G.aw-1;
    var sEnd=c.veryLong?G.shB+3:G.shB;
    px(g,ax,G.sy+1,G.aw,sEnd-G.sy-1,col.base);
    px(g,outer,G.sy+1,1,sEnd-G.sy-1,col.shade);
    px(g,ax,G.sy+1,1,sEnd-G.sy-1,INK);
    px(g,ax+G.aw-1,G.sy+1,1,sEnd-G.sy-1,INK);
    px(g,ax,sEnd,G.aw,1,col.deep);
  }
  if(c.veryLong) px(g,CX-G.tw,G.sy+16,G.tw*2,2,col.deep);
}

/* ---------- 袜子 ---------- */
function drawSocksG(g,G,o){
  var sk=SOCKS[o.socks]; if(!sk) return;
  var col=dyeOf(o.socksC);
  var off=parseInt(sk.top,10);
  var sTop=G.footY+off;
  for(var l=0;l<2;l++){
    var lx=l===0?CX-G.tw+1:CX+1;
    px(g,lx,sTop,G.lw,G.footY+2-sTop,col.base);
    px(g,lx+(l===0?0:G.lw-1),sTop,1,G.footY+2-sTop,col.shade);
    px(g,lx,sTop,G.lw,1,col.hi);
  }
}

/* ---------- 鞋 ---------- */
function drawShoesG(g,G,o){
  var sh=SHOES[o.shoes]; if(!sh) return;
  var col=dyeOf(o.shoesC), footY=G.footY;
  for(var s=0;s<2;s++){
    var sx=s===0?CX-G.tw:CX+1;
    var w=G.lw+1;
    if(o.shoes==='sandal'){
      px(g,sx,footY,w,2,col.base);
      px(g,sx+1,footY-2,1,2,col.base); px(g,sx+w-2,footY-2,1,2,col.base);
      px(g,sx,footY+2,w,1,col.deep);
    } else {
      var h=o.shoes==='boot'?9:3;
      px(g,sx,footY-h+2,w,h,col.base);
      px(g,sx,footY-h+2,w,1,col.shade);
      px(g,sx,footY+2,w,1,col.deep);
      px(g,sx-1,footY-h+2,1,h+1,INK);
      px(g,sx+w,footY-h+2,1,h+1,INK);
      px(g,sx,footY+3,w,1,INK);
      if(o.shoes==='sneaker'){ px(g,sx+1,footY,2,1,col.hi); px(g,sx+w-3,footY,2,1,col.hi); }
      if(o.shoes==='loafer'){ px(g,sx+2,footY-1,3,1,col.hi); }
    }
  }
}
function drawBody(g,f,skin,build,frame,o){
  o=o||{};
  var b=BUILDS[build]||BUILDS.normal;
  var tw=b.tw+(FRAMES[frame]||0), aw=b.aw;
  var out=tw+1+aw;
  var bot=f.top+f.w.length-1;
  var ny=bot-1;
  var sy=bot+6;
  var G={f:f,tw:tw,aw:aw,out:out,sy:sy,hem:CH-1,shY:CH,shB:CH,legTop:CH,footY:CH,lw:tw-2,
         full:false,bot:bot,ny:ny};

  /* 脖子 */
  px(g,CX-4,ny,8,sy-ny,skin.base);
  px(g,CX-4,ny,8,1,skin.deep);
  px(g,CX+2,ny,2,sy-ny,skin.shade);
  px(g,CX-5,ny,1,sy-ny+1,INK);
  px(g,CX+4,ny,1,sy-ny+1,INK);
  px(g,CX-4,sy-1,3,1,skin.shade);
  px(g,CX+1,sy-1,3,1,skin.light);

  /* 手臂 → 上身 → 袖 → 外套 */
  drawArmsSkin(g,G,skin);
  var dress=DRESSES[o.dress];
  if(dress) drawDressG(g,G,dyeOf(o.dressC),o.dress);
  else drawTopG(g,G,dyeOf(o.topC),o.top);
  if(!dress) drawSleeves(g,G,dyeOf(o.topC),o.top);
  if(COATS[o.coat]) drawCoatG(g,G,dyeOf(o.coatC),o.coat);
}


/* ==================== 全身 ==================== */
var FW=48, FH=128, FBASE=118;
var ARMW={slim:4,normal:5,plush:6};
var LEGLEN={petite:-9, std:0, tall:9};
function drawBodyFull(g,f,skin,o){
  o=o||{};
  var b=BUILDS[o.build]||BUILDS.normal;
  var tw=b.tw+(FRAMES[o.frame]||0);
  var aw=ARMW[o.build]||5;
  if(o.frame==='broad') aw++;
  else if(o.frame==='narrow') aw--;
  var out=tw+1+aw;
  var ll=LEGLEN[o.height]||0;
  var bot=f.top+f.w.length-1;
  var ny=bot-1;
  var sy=bot+6;
  var hem=sy+27;
  var shY=hem+2;
  var shB=shY+7;
  var legTop=shB+1;
  var footY=legTop+26+ll;
  var G={f:f,tw:tw,aw:aw,out:out,sy:sy,hem:hem,shY:shY,shB:shB,legTop:legTop,footY:footY,lw:tw-2,ll:ll,bot:bot,ny:ny,full:true};

  /* 脖子 */
  px(g,CX-4,ny,8,sy-ny,skin.base);
  px(g,CX-4,ny,8,1,skin.deep);
  px(g,CX+2,ny,2,sy-ny,skin.shade);
  px(g,CX-5,ny,1,sy-ny+1,INK);
  px(g,CX+4,ny,1,sy-ny+1,INK);
  px(g,CX-4,sy-1,3,1,skin.shade);
  px(g,CX+1,sy-1,3,1,skin.light);

  /* 腿 */
  var lw=tw-2, lh=footY-legTop+3;
  for(var l=0;l<2;l++){
    var lx=l===0?CX-tw+1:CX+1;
    var lo=l===0?lx:lx+lw-1;
    px(g,lx,legTop,lw,lh,skin.base);
    px(g,lo,legTop,1,lh,skin.shade);
    px(g,lx-1,legTop,1,lh,INK);
    px(g,lx+lw,legTop,1,lh,INK);
  }

  /* 袜子 → 下装 → 鞋 */
  drawSocksG(g,G,o);
  var dress=DRESSES[o.dress];
  if(dress) drawDressG(g,G,dyeOf(o.dressC),o.dress);
  else if(SKIRTS[o.skirt]) drawSkirtG(g,G,dyeOf(o.skirtC),o.skirt);
  else if(PANTS[o.pants]) drawPantsG(g,G,dyeOf(o.pantsC),o.pants);
  drawShoesG(g,G,o);

  /* 上身 → 手臂 → 外套 */
  if(!dress) drawTopG(g,G,dyeOf(o.topC),o.top);
  drawArmsSkin(g,G,skin);
  if(!dress) drawSleeves(g,G,dyeOf(o.topC),o.top);
  if(COATS[o.coat]) drawCoatG(g,G,dyeOf(o.coatC),o.coat);

  /* 底色：连衣裙没选时露出的腰线 */
  if(!dress && SKIRTS[o.skirt]) px(g,CX-tw+1,shY-1,tw*2-2,1,INK);
}

function drawCharFull(g,o,blink){
  var f=FACE[o.face]||FACE.oval;
  var skin=SKIN[o.skin]||SKIN.fair;
  var pal=HAIR[o.hairColor]||HAIR.black;
  var iris=IRIS[o.eyeColor]||IRIS.amber;
  var bk=BACK[o.hair]||BACK.short;
  var fr=FRINGE[o.bangs]||FRINGE.air;
  var dy=FBASE-(105+(LEGLEN[o.height]||0));
  g.save();
  g.translate(0,dy);
  if(bk.tail==='pony') tailPony(g,pal,f);
  if(bk.tail==='twin') tailTwin(g,pal,f);
  if(bk.tail==='bun') tailBun(g,pal,f,4);
  if(bk.tail==='half') tailBun(g,pal,f,3);
  hairMass(g,pal,f,bk);
  if(bk.tail==='braid') tailBraid(g,pal,f);
  hairVeins(g,pal,f,bk);
  drawBodyFull(g,f,skin,o);
  drawHead(g,f,skin);
  drawBrows(g,f,pal,o.brow);
  drawEyes(g,f,iris,skin,o.eye,blink);
  drawEyeliner(g,f,o.liner,o.eye);
  drawBlush(g,f,o.blush);
  drawNose(g,f,skin,o.nose);
  drawMouth(g,f,skin,o.mouth);
  drawEarring(g,f,o.earring);
  fr.draw(g,pal,f);
  drawAccessories(g,o);
  g.restore();
}

/* ==================== 头部 ==================== */
function drawHead(g,f,skin){
  rowsFill(g,f.w,f.top,1,INK);
  rowsFill(g,f.w,f.top,0,skin.base);
  /* 耳朵（纯线条，不做面部明暗） */
  var eh=hAt(f,f.eyeY);
  px(g,CX-eh-1,f.eyeY-1,1,3,skin.shade);
  px(g,CX-eh-2,f.eyeY-1,1,3,INK);
  px(g,CX+eh,f.eyeY-1,1,3,skin.shade);
  px(g,CX+eh+1,f.eyeY-1,1,3,INK);
}

/* ==================== 眉毛 ==================== */
var BROW_DY={
  straight:[0,0,0,0,0,0],
  sword:[-1,-1,0,0,1,1],
  arch:[1,0,-1,-1,0,1],
  thick:[0,0,0,0,0,0],
  thin:[1,0,0,0,0,1],
  angry:[-1,0,0,1,1,2],
  none:null
};
function drawBrows(g,f,pal,style){
  var dy=BROW_DY[style]; if(!dy) return;
  var y=f.browY, thick=(style==='thick')?2:1, col=(style==='thin')?pal.base:pal.dark;
  for(var side=0;side<2;side++){
    var bx=side===0?EYE_L:EYE_R;
    for(var i=0;i<6;i++){
      if(style==='thin' && (i===0||i===5)) continue;
      var x = side===0 ? bx+i : bx+5-i;
      px(g,x,y+dy[i],1,thick,col);
    }
    if(style==='thick') for(var j=0;j<6;j++){ var x2= side===0?bx+j:bx+5-j; px(g,x2,y+1,1,1,pal.base); }
  }
}

/* ==================== 眼睛 ==================== */
function epx(g,m,x,i,y,w,h,c){ var xx = m>0 ? x+i : x+5-i-(w-1); px(g,xx,y,w,h,c); }
function drawEyeOne(g,f,iris,skin,style,blink,m){
  var y=f.eyeY, x=(m>0?EYE_L:EYE_R);
  if(blink){
    for(var i=1;i<5;i++) epx(g,m,x,i,y,1,1,INK);
    epx(g,m,x,0,y+1,1,1,INK); epx(g,m,x,5,y+1,1,1,INK);
    return;
  }
  var wh='#FBF6EE', ws='#DED7CF';
  if(style==='round'){
    for(var a=0;a<6;a++){ epx(g,m,x,a,y-2,1,1,INK); epx(g,m,x,a,y-1,1,1,wh); epx(g,m,x,a,y,1,1,wh); epx(g,m,x,a,y+1,1,1,ws); }
    for(var b=2;b<5;b++){ epx(g,m,x,b,y-1,1,1,iris.base); epx(g,m,x,b,y,1,1,iris.base); epx(g,m,x,b,y+1,1,1,iris.dark); }
    epx(g,m,x,3,y,1,1,'#14101C');
    epx(g,m,x,2,y-1,1,1,'#FFFFFF');
    epx(g,m,x,5,y-1,1,1,INK);
    for(var c=0;c<6;c++) epx(g,m,x,c,y+2,1,1,skin.shade);
  } else if(style==='almon'){
    for(var a1=1;a1<6;a1++) epx(g,m,x,a1,y-2,1,1,INK);
    epx(g,m,x,0,y-3,1,1,INK);
    for(var a2=0;a2<6;a2++){ epx(g,m,x,a2,y-1,1,1,wh); epx(g,m,x,a2,y,1,1,wh); }
    for(var b2=2;b2<5;b2++){ epx(g,m,x,b2,y-1,1,1,iris.base); epx(g,m,x,b2,y,1,1,iris.dark); }
    epx(g,m,x,2,y-1,1,1,'#FFFFFF');
    epx(g,m,x,1,y+1,1,1,skin.shade); epx(g,m,x,4,y+1,1,1,skin.shade);
  } else if(style==='narrow'){
    for(var a3=0;a3<6;a3++) epx(g,m,x,a3,y-1,1,1,INK);
    px(g,x,y,6,1,wh);
    epx(g,m,x,2,y,1,1,iris.base); epx(g,m,x,3,y,1,1,iris.dark);
    for(var c3=0;c3<6;c3++) epx(g,m,x,c3,y+1,1,1,skin.shade);
  } else if(style==='fox'){
    epx(g,m,x,0,y-3,2,1,INK); epx(g,m,x,2,y-2,4,1,INK);
    for(var a4=0;a4<6;a4++){ epx(g,m,x,a4,y-1,1,1,wh); epx(g,m,x,a4,y,1,1,ws); }
    for(var b4=2;b4<5;b4++){ epx(g,m,x,b4,y-1,1,1,iris.base); epx(g,m,x,b4,y,1,1,iris.dark); }
    epx(g,m,x,2,y-1,1,1,'#FFFFFF');
    epx(g,m,x,0,y,1,1,INK);
  } else if(style==='droop'){
    epx(g,m,x,0,y-1,1,1,INK); epx(g,m,x,1,y-2,5,1,INK);
    for(var a5=0;a5<6;a5++){ epx(g,m,x,a5,y-1,1,1,wh); epx(g,m,x,a5,y,1,1,ws); }
    for(var b5=2;b5<5;b5++){ epx(g,m,x,b5,y-1,1,1,iris.base); epx(g,m,x,b5,y,1,1,iris.dark); }
    epx(g,m,x,2,y-1,1,1,'#FFFFFF');
    epx(g,m,x,0,y+1,1,1,skin.shade);
  } else if(style==='closed'){
    epx(g,m,x,0,y+1,1,1,INK); epx(g,m,x,1,y,1,1,INK); epx(g,m,x,2,y,1,1,INK);
    epx(g,m,x,3,y,1,1,INK); epx(g,m,x,4,y,1,1,INK); epx(g,m,x,5,y+1,1,1,INK);
  } else if(style==='wide'){
    for(var a6=0;a6<6;a6++){
      epx(g,m,x,a6,y-3,1,1,INK);
      epx(g,m,x,a6,y-2,1,1,wh); epx(g,m,x,a6,y-1,1,1,wh);
      epx(g,m,x,a6,y,1,1,wh); epx(g,m,x,a6,y+1,1,1,ws);
    }
    for(var b6=1;b6<5;b6++){
      epx(g,m,x,b6,y-2,1,1,iris.base); epx(g,m,x,b6,y-1,1,1,iris.base);
      epx(g,m,x,b6,y,1,1,iris.base); epx(g,m,x,b6,y+1,1,1,iris.dark);
    }
    epx(g,m,x,2,y-1,1,1,'#14101C'); epx(g,m,x,3,y-1,1,1,'#14101C');
    epx(g,m,x,1,y-2,1,1,'#FFFFFF'); epx(g,m,x,4,y,1,1,'#FFFFFF');
    for(var c6=0;c6<6;c6++) epx(g,m,x,c6,y+2,1,1,skin.shade);
  } else { /* sparkle */
    for(var a7=1;a7<6;a7++) epx(g,m,x,a7,y-2,1,1,INK);
    epx(g,m,x,0,y-3,1,1,INK);
    for(var a8=0;a8<6;a8++){ epx(g,m,x,a8,y-1,1,1,wh); epx(g,m,x,a8,y,1,1,wh); }
    for(var b7=2;b7<5;b7++){ epx(g,m,x,b7,y-1,1,1,iris.base); epx(g,m,x,b7,y,1,1,iris.dark); }
    epx(g,m,x,2,y-2,1,1,'#FFFFFF'); epx(g,m,x,4,y-1,1,1,'#FFFFFF'); epx(g,m,x,3,y,1,1,'#FFFFFF');
  }
}
function drawEyes(g,f,iris,skin,style,blink){
  drawEyeOne(g,f,iris,skin,style,blink,1);
  drawEyeOne(g,f,iris,skin,style,blink,-1);
}

/* ==================== 鼻子 / 嘴 ==================== */
function drawNose(g,f,skin,style){
  var x=CX-1, y=f.noseY;
  if(style==='none'){ px(g,x+1,y+1,2,1,skin.shade); }
  else if(style==='dot'){ px(g,x,y,1,1,skin.deep); px(g,x,y+1,2,1,skin.shade); }
  else if(style==='two'){ px(g,x-1,y,1,1,skin.deep); px(g,x+1,y,1,1,skin.deep); }
  else if(style==='hook'){ px(g,x,y,1,2,skin.deep); px(g,x-1,y+1,1,1,skin.deep); px(g,x+1,y,1,1,skin.light); }
  else { px(g,x-1,y,3,1,skin.shade); px(g,x,y+1,2,1,skin.deep); px(g,x-1,y+1,1,1,skin.light); }
}
function drawMouth(g,f,skin,style){
  var y=f.mouthY;
  if(style==='line'){
    px(g,CX-2,y,4,1,LIP); px(g,CX-1,y+1,2,1,skin.shade);
  } else if(style==='smile'){
    px(g,CX-2,y,4,1,LIP); px(g,CX-3,y-1,1,1,LIP); px(g,CX+2,y-1,1,1,LIP);
    px(g,CX-1,y+1,2,1,skin.shade);
  } else if(style==='grin'){
    px(g,CX-3,y,6,1,LIP_D);
    px(g,CX-2,y+1,4,1,MOUTH_D);
    px(g,CX-2,y,4,1,'#F2E6D8');
    px(g,CX-1,y+2,2,1,skin.shade);
  } else if(style==='press'){
    px(g,CX-2,y,3,1,LIP); px(g,CX-1,y+1,2,1,skin.shade);
  } else if(style==='pout'){
    px(g,CX-2,y+1,3,1,LIP); px(g,CX+2,y,1,1,LIP); px(g,CX-1,y+2,2,1,skin.shade);
  } else {
    px(g,CX-1,y,2,1,LIP_D);
    px(g,CX-1,y+1,2,1,MOUTH_D);
    px(g,CX,y+2,1,1,LIP);
  }
}

/* ==================== 头发：后发 + 刘海（两层独立） ==================== */
var BACK={
  short:   {n:'短发',  pad:3, crown:4, down:'mid'},
  bob:     {n:'波波',  pad:4, crown:4, down:'jaw', flare:1},
  ponytail:{n:'马尾',  pad:3, crown:4, down:'ear', tail:'pony'},
  twin:    {n:'双马尾',pad:4, crown:4, down:'ear', tail:'twin'},
  long:    {n:'长直',  pad:4, crown:4, down:'neck'},
  wavy:    {n:'波浪',  pad:4, crown:4, down:'neck', wave:1},
  halfup:  {n:'半扎',  pad:4, crown:4, down:'neck', tail:'half'},
  bun:     {n:'丸子',  pad:3, crown:4, down:'mid', tail:'bun'},
  braid:   {n:'麻花辫',pad:3, crown:4, down:'ear', tail:'braid'},
  afro:    {n:'蓬松',  pad:6, crown:5, down:'mid'}
};

/* ---------- 刘海 ---------- */
var FRINGE={
  none:{n:'全梳',draw:function(g,pal,f){
    var hh=hAt(f,f.top+2);
    for(var x=-hh+1;x<=hh-2;x++) px(g,CX+x,f.top+1,1,1,pal.dark);
  }},
  straight:{n:'齐',draw:function(g,pal,f){
    var hh=hAt(f,f.top+4), y0=f.top-1, h=f.browY-y0;
    px(g,CX-hh,y0,2*hh,h,pal.base);
    px(g,CX-hh,y0+h,2*hh,1,pal.dark);
    px(g,CX-hh,y0,1,h,pal.dark);
    px(g,CX+hh-1,y0,1,h,pal.dark);
    px(g,CX-6,y0+1,5,1,pal.hi);
    px(g,CX+3,y0+2,4,1,pal.hi);
  }},
  air:{n:'空气',draw:function(g,pal,f){
    var hh=hAt(f,f.top+4), y0=f.top-2;
    for(var x=-hh;x<=hh;x++){
      if(((x+hh)%5)===4) continue;

/* ---------- 基础量 ---------- */
function headFull(f){ var m=0; for(var i=0;i<f.w.length;i++) if(f.w[i]>m) m=f.w[i]; return m; }
function backEnd(f,o){
  if(o.down==='ear') return f.eyeY+1;
  if(o.down==='mid') return f.eyeY+4;
  if(o.down==='jaw') return f.bot+1;
  return f.bot+4;
}

/* ---------- 束发的部分（画在后发主体之前/之后） ---------- */
function tailPony(g,pal,f){
  var H=headFull(f)+3, x=CX+H-2, y=f.top+5;
  px(g,CX+H-3,f.top+3,4,2,'#C8566E');
  px(g,CX+H-3,f.top+4,4,1,'#A83E56');
  for(var i=0;i<19;i++){
    var w=(i<7)?3:2, xx=Math.min(x,CX+H+5);
    px(g,xx,y,w,1,(i%5===0)?pal.dark:pal.base);
    px(g,xx-1,y,1,1,INK); px(g,xx+w,y,1,1,INK);
    y++;
    if(i>13) x--;
  }
}
function tailTwin(g,pal,f){
  var H=headFull(f)+3;
  for(var s=0;s<2;s++){
    var sg=s?1:-1;
    var x=sg<0?CX-H+2:CX+H-5, y=f.top+6;
    px(g,x,f.top+5,4,2,'#C8566E');
    for(var i=0;i<12;i++){
      px(g,x,y,3,1,(i%4===0)?pal.dark:pal.base);
      px(g,x-1,y,1,1,INK); px(g,x+3,y,1,1,INK);
      y++;
      if(i>5) x+=sg;
    }
  }
}
function tailBun(g,pal,f,r){
  var cy=f.top-r-2;
  for(var dy=-r;dy<=r;dy++){
    var t=1-(dy*dy)/(r*r); if(t<=0) continue;
    var w=Math.round(r*Math.sqrt(t))+1;
    px(g,CX-w,cy+dy,2*w,1,INK);
  }
  for(var d2=-r+1;d2<=r-1;d2++){
    var t2=1-(d2*d2)/(r*r); if(t2<=0) continue;
    var w2=Math.round(r*Math.sqrt(t2));
    px(g,CX-w2,cy+d2,2*w2,1,pal.base);
  }
  px(g,CX-2,cy-1,3,1,pal.hi);
  px(g,CX-3,cy+r-1,6,1,'#C8566E');
}
function tailBraid(g,pal,f){
  var H=headFull(f)+2;
  for(var s=0;s<2;s++){
    var sg=s?1:-1;
    var x=CX+sg*(H-4), y=f.eyeY+1;
    for(var i=0;i<14;i++){
      var w=(i%3===0)?3:2;
      px(g,x,y,w,1,(i%3===0)?pal.base:pal.dark);
      px(g,x-1,y,1,1,INK); px(g,x+w,y,1,1,INK);
      y++; if(i>4) x+=sg;
    }
    px(g,x-sg,y-4,4,2,'#C8566E');
  }
}

/* ---------- 后发主体 ---------- */
function hairMass(g,pal,f,o){
  var H=headFull(f)+(o.pad||4), top=f.top-(o.crown||4), endY=backEnd(f,o);
  var rows=[];
  for(var i=0;i<(o.crown||4);i++){
    var t=(i+1)/(o.crown||4);
    rows.push(Math.max(5,Math.round(H*(0.35+0.65*Math.sqrt(t)))));
  }
  rowsFill(g,rows,top,1,INK);
  rowsFill(g,rows,top,0,pal.base);
  px(g,CX-Math.round(H*0.5),top+2,Math.round(H*0.5),1,pal.hi);
  px(g,CX+2,top+3,Math.round(H*0.3),1,pal.hi);
  for(var y=f.top;y<=endY;y++){
    var fh=hAt(f,y), off=0;
    if(o.wave) off=Math.round(Math.sin((y-f.top)*0.75)*1.4);
    if(!o.flare && y>endY-3) off+=(y-(endY-3));
    if(o.flare && y>endY-3) off-=(y-(endY-3));
    var wl=H-fh-1-off;
    if(wl<1) continue;
    var xL=CX-H+off, xR=CX+H-1-off;
    px(g,xL,y,1,1,INK);
    px(g,xL+1,y,wl-1,1,pal.base);
    px(g,xL+wl,y,1,1,pal.dark);
    px(g,xR,y,1,1,INK);
    px(g,xR-wl,y,wl-1,1,pal.base);
    px(g,xR-wl-1,y,1,1,pal.dark);
  }
  px(g,CX-H+2,endY+1,2,1,pal.base);
  px(g,CX-H+3,endY+2,1,1,pal.dark);
  px(g,CX+H-4,endY+1,2,1,pal.base);
  px(g,CX+H-5,endY+2,1,1,pal.dark);
}

/* ---------- 发丝 ---------- */
function hairVeins(g,pal,f,o){
  var H=headFull(f)+(o.pad||4), top=f.top-(o.crown||4), endY=backEnd(f,o);
  px(g,CX-9,top+3,4,1,pal.dark);
  px(g,CX+4,top+3,4,1,pal.dark);
  px(g,CX-1,top+3,2,1,pal.dark);
  px(g,CX-H+2,f.top+1,1,3,pal.dark);
  px(g,CX+H-3,f.top+1,1,3,pal.dark);
  px(g,CX-H+2,f.eyeY-1,1,3,pal.hi);
  px(g,CX+H-3,f.eyeY-1,1,3,pal.hi);
  if(o.down==='neck'){
    for(var k=0;k<4;k++){
      var y=f.bot-3+k*3;
      if(y>endY-1) break;
      px(g,CX-H+2,y,1,3,pal.dark);
      px(g,CX+H-3,y+1,1,3,pal.dark);
    }
  }
}

/* ==================== 眼线 ==================== */
var LIDROW={round:-1,almon:-1,narrow:0,fox:0,droop:-1,closed:0,wide:-2,sparkle:-1};
function drawEyeliner(g,f,style,eye){
  if(!style||style==='none') return;
  var y=f.eyeY, lr=y+(LIDROW[eye]||0), C='#241A24';
  [0,1].forEach(function(side){
    var ox = side===0 ? EYE_L : EYE_R+5;   /* 外眼角起点 */
    var d  = side===0 ? -1 : 1;            /* 朝外的方向 */
    px(g,ox,lr,1,1,C);
    px(g,ox-d,lr,1,1,C);
    px(g,ox-2*d,lr,1,1,C);
    if(style==='thin'){
      px(g,ox+d,lr,1,1,C);
    } else if(style==='natural'){
      px(g,ox-3*d,lr,1,1,C);
      px(g,ox+d,lr,1,1,C); px(g,ox+d,lr+1,1,1,C);
    } else if(style==='wing'){
      px(g,ox-3*d,lr,1,1,C);

    } else if(style==='droop'){

      px(g,ox+d,lr+1,1,1,C); px(g,ox+2*d,lr+1,1,1,C);
    } else if(style==='full'){
      for(var i=0;i<6;i++) px(g,ox-i*d,lr,1,1,C);
      for(var j=1;j<4;j++) px(g,ox-j*d,lr+2,1,1,C);

function drawBlush(g,f,style){
  if(!style||style==='none') return;
  var y=f.eyeY+4, c='#DD887C';

    for(var yy=0;yy<h;yy++) for(var xx=0;xx<w;xx++){
      if(solid||((xx+yy)%2===0)) px(g,x0+xx,y+yy,1,1,c);

  if(style==='soft'){ P(CX-11,3,1,false); P(CX+8,2,1,false); }
  else if(style==='deep'){ P(CX-11,4,2,true); P(CX+7,4,2,true); }

}
function drawEarring(g,f,style){
  var eh=hAt(f,f.eyeY), x=CX+eh+1, y=f.eyeY+2;

  drawBrows(g,f,pal,o.brow);
  drawEyes(g,f,iris,skin,o.eye,blink);
  drawEyeliner(g,f,o.liner,o.eye);

  fr.draw(g,pal,f);

  drawAccessories(g,o);
}

function setCat(i,play){
  if(i===catIdx){ if(play) sfx('move'); return; }
  catIdx=i;
  var c=VIEW[catIdx];
  optIdx=0;
  for(var j=0;j<c.items.length;j++) if(c.items[j].id===state[c.k]){ optIdx=j; break; }
  buildOpts(); syncCats(); syncSummary();
  if(play) sfx('move');
}
function setOpt(i,play){
  var c=VIEW[catIdx];
  i=(i+c.items.length)%c.items.length;
  if(i===optIdx && play){ sfx('move'); return; }
  optIdx=i; state[c.k]=c.items[i].id;
  buildOpts(); syncCats(); syncSummary();
  if(play) sfx('select');

  for(var j=0;j<c.items.length;j++) if(c.items[j].id===state[c.k]) optIdx=j;

function ring(g,cx,cy,r,c){
  for(var a=0;a<360;a+=12){
    g.fillRect(Math.round(cx+Math.cos(a*Math.PI/180)*r),Math.round(cy+Math.sin(a*Math.PI/180)*r),1,1,c);
  }
}
function ring2(g,cx,cy,r,c){
  g.fillStyle=c;
  for(var a=0;a<360;a+=15){
    g.fillRect(Math.round(cx+Math.cos(a*Math.PI/180)*r),Math.round(cy+Math.sin(a*Math.PI/180)*r),2,2);
  }
}
function poly(g,pts,color){
  var minY=9999,maxY=-9999,i,k;
  for(i=0;i<pts.length;i++){ if(pts[i][1]<minY)minY=pts[i][1]; if(pts[i][1]>maxY)maxY=pts[i][1]; }
  g.fillStyle=color;
  for(var y=Math.round(minY);y<=Math.round(maxY);y++){
    var xs=[];
    for(i=0;i<pts.length;i++){
      var A=pts[i], B=pts[(i+1)%pts.length];
      if(A[1]===B[1]) continue;
      if((A[1]<=y&&B[1]>=y)||(B[1]<=y&&A[1]>=y)) xs.push(A[0]+(B[0]-A[0])*((y-A[1])/(B[1]-A[1])));
    }
    xs.sort(function(a,b){return a-b;});
    for(k=0;k+1<xs.length;k+=2){
      var x1=Math.round(xs[k]), x2=Math.round(xs[k+1]);
      if(x2>x1) g.fillRect(x1,y,x2-x1,1);
    }
  }
}

function phaseOf(){
  var h=new Date().getHours();
  if(h>=6&&h<18) return 'day';
  if(h>=18&&h<20) return 'dusk';
  return 'night';
}
function weatherOf(){
  var d=new Date();
  var seed=(d.getFullYear()*400+(d.getMonth()+1)*40+d.getDate())*9+Math.floor(d.getHours()/4);
  var r=mkRand(seed), v=r();
  if(v<0.52) return 'clear';
  if(v<0.72) return 'cloudy';
  if(v<0.9) return 'rain';
  return 'snow';
}

    var o=JSON.parse(raw);
    for(var k in DECO_GROUPS){
      if(o[k]==null) continue;
      var n=+o[k]; if(isFinite(n)) DECO_SEL[k]=Math.max(0,Math.min(DECO_GROUPS[k].sets.length-1,n));

var decoCat='floor';
function buildDeco(){
  var tabs=document.getElementById('decoTabs'), chips=document.getElementById('decoChips');
  if(!tabs||!chips) return;
  tabs.textContent=''; chips.textContent='';
  DECO_ORDER.forEach(function(k){
    var g=DECO_GROUPS[k];
    var b=document.createElement('button'); b.type='button'; b.className='dtab';
    b.textContent=g.n; b.setAttribute('aria-pressed', k===decoCat?'true':'false');
    b.addEventListener('click', function(){ decoCat=k; buildDeco(); sfx('tick'); });
    tabs.appendChild(b);
  });
  var cur=DECO_GROUPS[decoCat];
  cur.sets.forEach(function(st, idx){
    var b=document.createElement('button'); b.type='button'; b.className='dchip';
    var sw=document.createElement('span'); sw.className='dsw';
    for(var i=0;i<Math.min(3,st.c.length);i++){
      var q=document.createElement('i'); q.style.background=st.c[i]; sw.appendChild(q);
    }
    b.appendChild(sw);
    var t=document.createElement('span'); t.textContent=st.n; b.appendChild(t);
    b.setAttribute('aria-pressed', idx===DECO_SEL[decoCat]?'true':'false');
    b.addEventListener('click', function(){
      DECO_SEL[decoCat]=idx; decoSave(); roomSceneKey=''; ensureRoomScene(); buildDeco(); bufAge=99; sfx('select');
    });
    chips.appendChild(b);

}

function drawRoomFrame(ts){
  var t=ts/1000;
  var skin=SKIN[state.skin]||SKIN.fair;
  if(bufAge++>6){ cbc.clearRect(0,0,FW,FH); drawCharFull(cbc,state,((t%4.3)<0.15)); bufAge=0; }
  var ph=phaseOf(), we=weatherOf();
  ensureRoomScene();
  rc.clearRect(0,0,ROOM_W,ROOM_H);
  rc.drawImage(roomBg,0,0);
  drawSky(t,ph,we);
  drawRoomCat(rc,t);

  var a=roomAct||ACTS[0];
  if(walkMove && (ts-walkMove.t0)>=walkMove.dur) finishWalk();
  if(!walkMove && ts>=actUntil) pickAct(ts);
  a=roomAct||ACTS[0];
  var p=posOf(a), X=p.X, Y=p.Y, pose=a.pose, walking=false;
  if(walkMove){
    walking=true; pose='walk';
    var k=(ts-walkMove.t0)/walkMove.dur; if(k<0)k=0; if(k>1)k=1;
    X=walkMove.x0+(walkMove.x1-walkMove.x0)*k;
    if(k<.16) Y=walkMove.y0+(109-walkMove.y0)*(k/.16);
    else if(k>.84) Y=109+(walkMove.y1-109)*((k-.84)/.16);
    else Y=109;
  }

  rc.save();
  rc.translate(Math.round(X),Math.round(Y)); rc.scale(CS,CS);

  if(pose==='walk'){
    rc.translate(0,-Math.round(Math.abs(Math.sin(t*7.2))*2));
    rc.drawImage(cb,0,0,FW,FH,0,0,FW,FH);
  }else if(pose==='lie'){
    rc.drawImage(cb,0,0,FW,44,0,0,FW,44);
  }else if(pose==='sit'){
    rc.drawImage(cb,0,0,FW,76,0,0,FW,76);
    drawShins(rc,0,0,p.legLen,skin);
  }else if(pose==='fold'){
    rc.drawImage(cb,0,0,FW,76,0,0,FW,76);
    px(rc,7,75,34,6,skin.base);
    px(rc,7,80,34,1,skin.shade);
    px(rc,7,75,4,4,'#3E4A6E');
    px(rc,37,75,4,4,'#3E4A6E');
  }else{
    var bob = pose==='dance' ? Math.round(Math.sin(t*8)*6) : Math.round(Math.sin(t*1.4)*2);
    var sway = pose==='dance' ? Math.round(Math.sin(t*4)*5) : 0;
    rc.translate(sway,bob);
    rc.drawImage(cb,0,0,FW,FH,0,0,FW,FH);
  }
  if(!walking) drawProp(rc,a.prop,0,0,t,skin);
  rc.restore();

  /* 书桌台面压住腿 */
  if((!walking && a.spot==='desk') || (walking && Y<112 && X<130)){
    useGroup('desk');
    poly(rc,[[24,124],[96,124],[102,133],[18,133]],C('#B08A5C'));
    rc.fillStyle=C('#C79E6C'); rc.fillRect(25,124,71,1);
    poly(rc,[[18,133],[102,133],[102,136],[18,136]],C('#96703F'));
    rc.fillStyle=C('#8A6440'); rc.fillRect(20,136,82,15);
    rc.fillStyle=C('#9A7450'); rc.fillRect(22,138,78,11);
    rc.fillStyle='#E8DCC4'; rc.fillRect(52,142,14,3);
    rc.fillStyle=C('#7C5638'); rc.fillRect(20,151,7,25); rc.fillRect(95,151,7,25);
    useGroup(null);
  }
  drawRoomLight(ph);
  drawStringLights(t);
  if(!reduced) drawRoomMotes(t);

  var sec=Math.floor(t);
  if(sec!==lastSec){
    lastSec=sec;
    if(camTime){
      var d=new Date();
      var p2=function(n){ return (n<10?'0':'')+n; };
      camTime.textContent='CAM 01  '+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds());
      var envEl=document.getElementById('roomEnv');
      if(envEl) envEl.textContent=PH_LABEL[ph]+' · '+WE_LABEL[we];
    }
  }
}

function fitRoom(){

  var s=Math.min(Math.floor((window.innerWidth-56)/ROOM_W), Math.floor((window.innerHeight-pad)/ROOM_H));
  if(s>4) s=4; if(s<1) s=1;

function posOf(a){
  var X=118,Y=109,hip=0,foot=168,legLen=0;
  if(a.spot==='desk'){ X=30;  hip=124; foot=146; legLen=42; }
  else if(a.spot==='window'){ X=120; hip=82;  foot=101; legLen=38; }
  else if(a.spot==='bed'){ X=246; hip=118; foot=150; legLen=42; }
  if(a.pose==='lie'){ X=196; Y=96; }
  else if(a.pose==='sit'){ Y=hip-38; }
  else if(a.pose==='fold'){ Y=168-38; }
  else { Y=foot-59; }
  return {X:X,Y:Y,hip:hip,foot:foot,legLen:legLen};
}
function actDur(a){
  var d=6200+Math.random()*15000;
  if(a.id==='sleep'||a.id==='movie') d*=1.7;
  if(a.id==='dance'||a.id==='sing') d*=.62;
  return Math.round(d);
}
/* 让她走去某个动作：算路径、算时长，交给主循环去走 */
function goToAct(next,nowRef){
  if(!next) return;
  var p0=roomAct?posOf(roomAct):{X:118,Y:109};
  var p1=posOf(next);
  var ms = (nowRef!=null) ? nowRef : ((typeof performance!=='undefined'&&performance.now)?performance.now():Date.now());
  walkMove={t0:ms,dur:Math.round(700+Math.abs(p1.X-p0.X)*15+Math.abs(p1.Y-p0.Y)*9),
            x0:p0.X,y0:p0.Y,x1:p1.X,y1:p1.Y,to:next};
  actUntil=ms+walkMove.dur+actDur(next);
  var dEl=document.getElementById('roomDoing'); if(dEl) dEl.textContent='走过去…';
  document.getElementById('roomName').textContent=name||'未命名';
}
function pickAct(nowRef){
  var pool=ACTS.filter(function(x){ return x!==roomAct; });
  goToAct(pool[Math.floor(Math.random()*pool.length)]||ACTS[0],nowRef);
  sfx('move');
}
/* ---- 房间里的热区：点哪儿，她去哪 ---- */
var SPOT_HIT=[
  {spot:'bed',    x0:168,x1:286,y0:76, y1:166},
  {spot:'desk',   x0:12, x1:108,y0:98, y1:162},
  {spot:'rug',    x0:96, x1:200,y0:162,y1:180},
  {spot:'window', x0:98, x1:188,y0:12, y1:92}
];
function spotAt(x,y){
  for(var i=0;i<SPOT_HIT.length;i++){
    var h=SPOT_HIT[i];
    if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1) return h.spot;
  }
  return 'floor';
}
/* 点地毯/床/桌子/窗：随机挑一个该地点能做的事，走过去 */
function sendTo(spot){
  var pool=ACTS.filter(function(a){ return a.spot===spot; });
  if(!pool.length) pool=ACTS;
  var next=pool[Math.floor(Math.random()*pool.length)];
  if(next===roomAct && !walkMove){ sfx('move'); return; }
  goToAct(next,null);
  sfx('select');
}
function finishWalk(){
  if(!walkMove) return;
  roomAct=walkMove.to; walkMove=null; bufAge=99;
  var dEl=document.getElementById('roomDoing');
  if(dEl) dEl.textContent='在'+roomAct.n;
}
function enterRoom(){
  roomOn=true; room.hidden=false; setRoomFlag(1);
  document.getElementById('roomName').textContent=name||'未命名';
  roomAct=null; pickAct(); fitRoom(); buildDeco(); bufAge=99;
}
function exitRoom(){
  roomOn=false; room.hidden=true; setRoomFlag(0); sfx('back'); fitStage();
}

    li.appendChild(b); catsEl.appendChild(li);
    /* 饰品：展开 6 个子类 */
    if(i===0 && m.subs && dressMainIdx===0){
      m.subs.forEach(function(s,j){
        var sli=document.createElement('li');
        var sb=document.createElement('button'); sb.className='cat'; sb.type='button';
        sb.style.marginLeft='16px';
        sb.style.width='calc(100% - 16px)';
        sb.setAttribute('aria-selected', j===dressSubIdx?'true':'false');
        sb.innerHTML='<span class="idx">·</span><span class="nm">'+s.n+
                     '</span><span class="ldr"></span><span class="vl">'+accLabel(s,state[s.k])+'</span>';
        sb.addEventListener('click', function(){ dressSubIdx=j; dressBuild(); sfx('tick'); });
        sli.appendChild(sb); catsEl.appendChild(sli);
      });
    }
  });
  var c=curDressCat();
  document.getElementById('dressTitle').innerHTML=c.n+'<em>'+c.en+'</em>';
  var curIdx=0;
  c.items.forEach(function(it,i){ if(it[0]===state[c.k]) curIdx=i; });
  document.getElementById('dressCount').textContent=pad(curIdx+1)+' / '+pad(c.items.length);
  optsEl.textContent='';
  c.items.forEach(function(it,idx){
    var b=document.createElement('button'); b.className='cell'; b.type='button';
    var o=Object.assign({},state); o[c.k]=it[0];
    b.appendChild(accThumb(o,c.src));
    var sp=document.createElement('span'); sp.className='cn'; sp.textContent=it[1];
    b.appendChild(sp);
    b.setAttribute('aria-selected', state[c.k]===it[0]?'true':'false');
    b.addEventListener('click', function(){
      state[c.k]=it[0];
      /* 裙子 / 连衣裙互斥：选了一个，另一个自动摘掉 */
      if(c.k==='dress' && it[0]!=='none') state.skirt='none';
      if(c.k==='skirt' && it[0]!=='none') state.dress='none';
      save(); bufAge=99; sfx('select'); dressBuild();
    });
    optsEl.appendChild(b);
  });
  /* 颜色行：这件单品可以染 8 种颜色 */
  var dyeEl=document.getElementById('dressDye');
  if(dyeEl){
    if(c.dye){
      dyeEl.hidden=false;
      dyeEl.textContent='';
      dyeEl.style.cssText='display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 2px 0';
      var lab=document.createElement('span');
      lab.textContent='颜色';
      lab.style.cssText='font-size:11px;letter-spacing:.08em;color:#8A7A66;margin-right:6px';
      dyeEl.appendChild(lab);
      if(typeof state[c.dye]!=='number') state[c.dye]=0;
      DYE.forEach(function(d,di){
        var sw=document.createElement('button');
        sw.type='button'; sw.title=d.n; sw.setAttribute('aria-label',d.n);
        sw.style.cssText='width:20px;height:20px;padding:0;border-radius:3px;cursor:pointer;background:'+d.base+
          ';border:2px solid '+((state[c.dye]|0)===di?'#3A2E28':'rgba(0,0,0,0)');
        sw.addEventListener('click', function(){
          state[c.dye]=di; save(); bufAge=99; sfx('select'); dressBuild();
        });
        dyeEl.appendChild(sw);
      });
    } else { dyeEl.hidden=true; dyeEl.textContent=''; }
  }
  dressPreview();
}
function openDresser(){
  var d=document.getElementById('dress'); if(!d) return;
  d.hidden=false; dressOn=true; dressBuild();
}
function closeDresser(){
  var d=document.getElementById('dress'); if(!d) return;
  d.hidden=true; dressOn=false; bufAge=99;
}

/* ==================== 缩放 ==================== */
function setStageSize(){
  if(page==='body'){ SW=80; SH=150; CHAR_X=16; CHAR_Y=8; }
  else { SW=80; SH=96; CHAR_X=16; CHAR_Y=28; }
  stage.width=SW; stage.height=SH;
  document.documentElement.style.setProperty('--sw',SW);
  document.documentElement.style.setProperty('--sh',SH);
  fitStage();
}
function fitStage(){
  var col=document.querySelector('.stage-win');
  if(!col) return;
  var w=col.clientWidth-26;
  var sW=Math.floor(w/SW);
  var sH=Math.floor((window.innerHeight-200)/SH);
  var s=Math.min(sW,sH);
  if(s>5) s=5;
  if(s<2) s=2;
  document.documentElement.style.setProperty('--s',s);
}
function setPage(p,play){
  if(p===page) return;
  page=p;
  VIEW=CATS.filter(function(c){ return c.page===page; });
  catIdx=0; optIdx=0;
  var c=VIEW[0];
  for(var j=0;j<c.items.length;j++) if(c.items[j].id===state[c.k]){ optIdx=j; break; }
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].setAttribute('aria-selected', tabs[i].getAttribute('data-page')===page?'true':'false');
  }
  document.getElementById('partCount').textContent=pad(VIEW.length);
  setStageSize();
  buildCats(); buildOpts(); syncAll();
  if(play) sfx('move');
}
var rz;
window.addEventListener('resize',function(){ clearTimeout(rz); rz=setTimeout(fitStage,120); });

/* ==================== 启动 ==================== */
load();
document.getElementById('nameInput').value=name;
document.getElementById('plateName').textContent=name||'未命名';
document.getElementById('btnSound').textContent = soundOn?'SOUND ON':'SOUND OFF';
document.getElementById('btnSound').setAttribute('aria-pressed', soundOn?'true':'false');
buildCats();
var c0=VIEW[catIdx];
for(var q=0;q<c0.items.length;q++) if(c0.items[q].id===state[c0.k]){ optIdx=q; break; }
buildOpts(); syncAll(); setStageSize();
decoLoad();
(function(){
  var b=document.getElementById('btnDeco');
  if(b) b.addEventListener('click', function(){ setDecoOpen(!decoOpen); sfx('tick'); });
  var cv=document.getElementById('roomCv');
  function roomPoint(e){
    var r=cv.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*ROOM_W, y:(e.clientY-r.top)/r.height*ROOM_H};
  }
  function inWardrobe(e){
    var p=roomPoint(e);
    return p.x>=26&&p.x<=74&&p.y>=20&&p.y<=102;
  }
  if(cv){
    cv.addEventListener('click', function(e){
      if(!roomOn||dressOn) return;
      if(inWardrobe(e)){ openDresser(); return; }
      var p=roomPoint(e);
      sendTo(spotAt(p.x,p.y));
    });
    cv.addEventListener('mousemove', function(e){
      cv.style.cursor=(roomOn&&!dressOn)?'pointer':'';
    });
  }
  var cd=document.getElementById('btnDressClose');
  if(cd) cd.addEventListener('click', function(){ closeDresser(); sfx('back'); });
  document.addEventListener('keydown', function(e){
    if(dressOn && (e.key==='Escape'||e.key==='q')){ closeDresser(); sfx('back'); }
  });
})();
try{ if(localStorage.getItem('pixeljrpg.room')==='1') enterRoom(); }catch(e){}
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){ setPage(b.getAttribute('data-page'),true); });
});

var last=0;
function loop(ts){
  if(ts-last>16){ if(roomOn) drawRoomFrame(ts); else drawStageFrame(ts); last=ts; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
